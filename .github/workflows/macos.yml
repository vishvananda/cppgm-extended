name: Intel macOS port

on:
  push:
    branches: [v8macho]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-port-${{ github.ref }}
  cancel-in-progress: true

env:
  CPPGM_WARNINGS_AS_ERRORS: "1"

jobs:
  native:
    name: Mach-O and self-hosting / LLVM ${{ matrix.llvm }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        llvm: [18, 21]
    env:
      CPPGM_STDLIB_FLAGS: ''
    steps:
      - uses: actions/checkout@v6
      - name: Install Homebrew LLVM Intel bottle
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          # This Homebrew revision still includes Intel LLVM 18/21 bottles.
          # Current revisions only publish ARM bottles for macOS.
          brew tap-new cppgm/ci
          formula_name="llvm@${{ matrix.llvm }}"
          formula="$(brew --repository cppgm/ci)/Formula/$formula_name.rb"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Homebrew/homebrew-core/c722500ede2e1d33523c27ef11338fec48adfdf9/Formula/l/$formula_name.rb" \
            --output "$formula"
          python3 - "$formula" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          text = text.replace('  bottle do\n',
                              '  bottle do\n    root_url "https://ghcr.io/v2/homebrew/core"\n', 1)
          path.write_text(text)
          PY
          brew install --force-bottle "cppgm/ci/$formula_name"
      - name: Select Homebrew LLVM
        run: |
          host_llvm="$(brew --prefix 'cppgm/ci/llvm@${{ matrix.llvm }}')"
          test -x "$host_llvm/bin/clang++"
          host_sdk="$(xcrun --sdk macosx --show-sdk-path)"
          host_tools="$RUNNER_TEMP/host-llvm-${{ matrix.llvm }}"
          mkdir -p "$host_tools"
          # Keep SDK selection identical in builds, header discovery and linking.
          python3 - "$host_llvm/bin/clang++" "$host_sdk" "$host_tools/clang++" <<'PY'
          from pathlib import Path
          import shlex
          import sys
          compiler, sdk, wrapper = sys.argv[1:]
          path = Path(wrapper)
          path.write_text('#!/bin/sh\nexec ' + shlex.join(
              [compiler, '--no-default-config', '-isysroot', sdk]) + ' "$@"\n')
          path.chmod(0o755)
          PY
          printf '%s\n%s\n' "$host_llvm/bin" "$host_tools" >> "$GITHUB_PATH"
          printf 'CXX=%s\nCPPGM_HOST_CXX=%s\n' \
            "$host_tools/clang++" "$host_tools/clang++" >> "$GITHUB_ENV"
          printf 'SDKROOT=%s\n' "$host_sdk" >> "$GITHUB_ENV"
          echo "Host compiler: $host_llvm/bin/clang++"
          echo "SDK: $host_sdk"
          "$host_tools/clang++" --version
          if ! "$host_tools/clang++" -std=c++11 -Wall -Werror -fsyntax-only -x c++ - <<'CPP'
          #include <cstdint>
          #include <cstdlib>
          #include <cstring>
          #include <cmath>
          static_assert(sizeof(std::uintptr_t) == 8, "x86-64 SDK");
          int main() {
            char text[2] = {};
            std::memcpy(text, "a", 2);
            return std::strlen(text) != 1 || !std::isfinite(1.0);
          }
          CPP
          then
            "$host_tools/clang++" -v -E -x c++ /dev/null > /dev/null
            exit 1
          fi
      - name: Build the compiler and native tools
        run: make -C dev -j4 CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
      - name: Execute standalone Mach-O programs and check mixed host objects
        run: |
          make -C pa24 test-macho CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
          make -C pa25 test-macho CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
          make -C pa26 test-macho CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
          make -C pa27 test-macho CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
      - name: Compare self-built and inception compilers
        run: |
          make -C pa34 cppgm++-self CXX=../dev/cppgm++ CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            INCEPTION_BUILD_JOBS=4 INCEPTION_OBJECT_BUILD_JOBS=4
          make -C pa34 compare-cppgm++-inception CXX=../dev/cppgm++ CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            INCEPTION_BUILD_JOBS=4 INCEPTION_OBJECT_BUILD_JOBS=4
