name: Intel macOS port

on:
  push:
    branches: [main, v8macho]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-port-${{ github.ref }}
  cancel-in-progress: true

env:
  CPPGM_WARNINGS_AS_ERRORS: "1"

jobs:
  native:
    name: Mach-O and self-hosting / LLVM ${{ matrix.llvm }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        llvm: [18, 21]
    env:
      CPPGM_STDLIB_FLAGS: ''
    steps:
      - uses: actions/checkout@v6
      - name: Install Homebrew LLVM Intel bottle
        run: bash scripts/install_macos_llvm.sh '${{ matrix.llvm }}'
      - name: Select Homebrew LLVM
        run: |
          host_llvm="$(brew --prefix 'cppgm/ci/llvm@${{ matrix.llvm }}')"
          test -x "$host_llvm/bin/clang++"
          host_sdk="$(xcrun --sdk macosx --show-sdk-path)"
          host_tools="$RUNNER_TEMP/host-llvm-${{ matrix.llvm }}"
          mkdir -p "$host_tools"
          # Keep SDK selection identical in builds, header discovery and linking.
          python3 - "$host_llvm/bin/clang++" "$host_sdk" "$host_tools/clang++" <<'PY'
          from pathlib import Path
          import shlex
          import sys
          compiler, sdk, wrapper = sys.argv[1:]
          path = Path(wrapper)
          base = shlex.join([compiler, '--no-default-config', '--sysroot=' + sdk, '-isysroot', sdk])
          library = Path(compiler).parent.parent / 'lib'
          directories = [p for p in [library / 'c++', library / 'unwind', library] if p.is_dir()]
          link = shlex.join([f'-L{p}' for p in directories] + ['-lunwind'] +
                            [f'-Wl,-rpath,{p}' for p in directories])
          # Homebrew's bundled libc++/unwind flags apply only when linking.
          path.write_text('#!/bin/sh\nfor argument do\n  case "$argument" in\n'
                          '    -c|-S|-E|-M|-MM|-fsyntax-only|--version)\n'
                          '      exec ' + base + ' "$@" ;;\n'
                          '  esac\ndone\nexec ' + base + ' ' + link + ' "$@"\n')
          path.chmod(0o755)
          PY
          printf '%s\n%s\n' "$host_llvm/bin" "$host_tools" >> "$GITHUB_PATH"
          printf 'CXX=%s\nCPPGM_HOST_CXX=%s\n' \
            "$host_tools/clang++" "$host_tools/clang++" >> "$GITHUB_ENV"
          printf 'SDKROOT=%s\n' "$host_sdk" >> "$GITHUB_ENV"
          echo "Host compiler: $host_llvm/bin/clang++"
          echo "SDK: $host_sdk"
          "$host_tools/clang++" --version
          if ! "$host_tools/clang++" -std=c++11 -Wall -Werror -x c++ - -o "$host_tools/sdk-check" <<'CPP'
          #include <cstdint>
          #include <cstdlib>
          #include <cstring>
          #include <cmath>
          static_assert(sizeof(std::uintptr_t) == 8, "x86-64 SDK");
          int main() {
            char text[2] = {};
            std::memcpy(text, "a", 2);
            return std::strlen(text) != 1 || !std::isfinite(1.0);
          }
          CPP
          then
            "$host_tools/clang++" -v -E -x c++ /dev/null > /dev/null
            "$host_tools/clang++" -### -x c++ /dev/null -o "$host_tools/sdk-check"
            exit 1
          fi
          "$host_tools/sdk-check"
      - name: Build the compiler and native tools
        run: make -C dev -j4 CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
      - name: Run the default Intel macOS test report
        run: make test-report CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"
      - name: Compare self-built and inception compilers
        run: |
          make -C pa34 cppgm++-self CXX=../dev/cppgm++ CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            INCEPTION_BUILD_JOBS=4 INCEPTION_OBJECT_BUILD_JOBS=4
          make -C pa34 compare-cppgm++-inception CXX=../dev/cppgm++ CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            INCEPTION_BUILD_JOBS=4 INCEPTION_OBJECT_BUILD_JOBS=4
      - name: Retain failing test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-llvm-${{ matrix.llvm }}-diagnostics
          path: |
            pa*/tests/**/*.my*.stderr
            pa*/tests/**/*.my*.exit_status
            pa*/tests/**/*.my*.inspect
            pa*/tests/**/*.my*.link_command
            pa*/tests/**/*.my*.unresolved_symbols
          retention-days: 7
