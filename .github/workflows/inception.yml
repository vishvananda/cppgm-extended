name: Inception

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:
    inputs:
      selfhost_run_id:
        description: GitHub Actions run id from a successful Tests or Selfhost run
        required: true
      flavor:
        description: Selfhost artifact flavor
        required: true
        default: ubuntu-24.04-gcc
        type: choice
        options:
          - ubuntu-24.04-gcc
          - ubuntu-24.04-clang-libcxx
          - ubuntu-26.04-gcc
          - ubuntu-26.04-clang-libcxx

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: select flavors
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main')))

    outputs:
      flavors: ${{ steps.select.outputs.flavors }}

    steps:
      - name: Select the selfhost flavors to compare
        id: select
        run: |
          set -euo pipefail
          # A manual run compares the one flavor it names; a completed Tests
          # run compares every flavor whose self compiler that run uploaded.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            flavors='["${{ github.event.inputs.flavor }}"]'
          else
            flavors='["ubuntu-24.04-gcc","ubuntu-24.04-clang-libcxx","ubuntu-26.04-gcc","ubuntu-26.04-clang-libcxx"]'
          fi
          printf 'flavors=%s\n' "$flavors" >> "$GITHUB_OUTPUT"
          printf 'Comparing inception for: %s\n' "$flavors"

  compare-cppgm-inception:
    name: compare cppgm++ inception / ${{ matrix.flavor }} (non-required on PRs)
    needs: plan
    runs-on: ubuntu-24.04
    container:
      image: ${{ contains(matrix.flavor, '26.04') && 'ubuntu:26.04' || 'ubuntu:24.04' }}
    timeout-minutes: 300

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.plan.outputs.flavors) }}

    env:
      SELFHOST_FLAVOR: ${{ matrix.flavor }}
      CXX: ${{ contains(matrix.flavor, 'clang-libcxx') && 'clang++' || 'g++' }}
      CPPGM_HOST_CXX: ${{ contains(matrix.flavor, 'clang-libcxx') && 'clang++' || 'g++' }}
      CPPGM_STDLIB_FLAGS: ${{ contains(matrix.flavor, 'clang-libcxx') && '-stdlib=libc++' || '' }}
      SELFHOST_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.selfhost_run_id }}
      ARTIFACT_NAME: cppgm-self-${{ matrix.flavor }}

    steps:
      - name: Install host compiler
        run: |
          set -euo pipefail
          packages="bash ca-certificates git make perl tar build-essential"
          if [[ "$SELFHOST_FLAVOR" == *clang-libcxx ]]; then
            packages="$packages clang libc++-dev libc++abi-dev"
          fi
          apt-get update
          apt-get install -y --no-install-recommends $packages

      - name: Download cppgm++ self compiler artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ env.SELFHOST_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/self-artifact

      - name: Read artifact metadata
        id: metadata
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/self-artifact/metadata.env"
          if [ ! -f "$metadata" ]; then
            echo "missing metadata.env in artifact" >&2
            exit 2
          fi
          source_sha=$(sed -n 's/^source_sha=//p' "$metadata" | head -n 1)
          source_repository=$(sed -n 's/^source_repository=//p' "$metadata" | head -n 1)
          if [ -z "$source_sha" ]; then
            echo "artifact metadata did not contain source_sha" >&2
            exit 2
          fi
          if [ -n "$source_repository" ] && [ "$source_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "artifact came from $source_repository, expected $GITHUB_REPOSITORY" >&2
            exit 2
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          cat "$metadata"

      - name: Check out matching source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.metadata.outputs.source_sha }}

      - name: Restore cppgm++ self compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restored-self"
          tar -C "$RUNNER_TEMP/restored-self" -xzf \
            "$RUNNER_TEMP/self-artifact/cppgm-self.tar.gz"
          (cd "$RUNNER_TEMP/restored-self" && sha256sum -c SHA256SUMS)
          test -x "$RUNNER_TEMP/restored-self/bin/cppgm++-self"
          "$RUNNER_TEMP/restored-self/bin/cppgm++-self" --version || true

      - name: Show compiler configuration
        run: |
          "$CXX" --version
          printf 'CXX=%s\n' "$CXX"
          printf 'CPPGM_HOST_CXX=%s\n' "$CPPGM_HOST_CXX"
          printf 'CPPGM_STDLIB_FLAGS=%s\n' "$CPPGM_STDLIB_FLAGS"
          printf 'INCEPTION_RESTORED_CPPGM_SELF=%s\n' "$RUNNER_TEMP/restored-self/bin/cppgm++-self"

      - name: Compare cppgm++ inception
        id: compare
        run: |
          CPPGM_OBJECT_ROOT="$GITHUB_WORKSPACE/obj/pa39/restored-self-driver" \
            make -C pa39 compare-cppgm++-inception-from-restored-self \
            INCEPTION_RESTORED_CPPGM_SELF="$RUNNER_TEMP/restored-self/bin/cppgm++-self" \
            CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            CPPGM_STDLIB_FLAGS="$CPPGM_STDLIB_FLAGS"

      - name: Summarize result
        if: always()
        run: |
          {
            echo "### cppgm++ inception"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Selfhost run id: \`$SELFHOST_RUN_ID\`"
            echo "- Flavor: \`$SELFHOST_FLAVOR\`"
            echo "- Artifact: \`$ARTIFACT_NAME\`"
            echo "- Source SHA: \`${{ steps.metadata.outputs.source_sha }}\`"
            echo "- Compare outcome: \`${{ steps.compare.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.compare.outcome }}" != "success" ] &&
             [ "${{ github.event_name }}" = "workflow_run" ] &&
             [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            echo "::warning::cppgm++ inception advisory failed for this PR."
          fi
