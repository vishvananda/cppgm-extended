name: Dedicated Intel library benchmark

on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      revision:
        type: string
        required: true
      runner_label:
        type: string
        required: true

jobs:
  measure:
    name: Intel ${{ inputs.suite }}
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, '${{ inputs.runner_label }}']
    permissions:
      contents: read
    timeout-minutes: ${{ inputs.suite == 'boost' && 180 || 150 }}
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: |
            scripts
            benchmarks
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
          path: source
          persist-credentials: false
      - name: Record the measured revision and check Intel hardware
        id: revision
        run: |
          python3 -c 'import pathlib; assert "GenuineIntel" in pathlib.Path("/proc/cpuinfo").read_text(), "Intel CPU required"'
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and measure in Ubuntu 26.04
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          engine=$(command -v podman || command -v docker)
          "$engine" run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work/source \
            -e CXX=g++ -e CPPGM_HOST_CXX=g++ -e CPPGM_STDLIB_FLAGS= \
            -e CPPGM_WARNINGS_AS_ERRORS=1 -e SUITE \
            ubuntu:26.04 bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential binutils ca-certificates clang git python3 time
              case "$SUITE" in
                godot)
                  apt-get install -y --no-install-recommends pkg-config python3-pip
                  python3 -m pip install --break-system-packages scons==4.10.1 ;;
                boost)
                  apt-get install -y --no-install-recommends bzip2 gdb ;;
                index-cpp|simdjson|internal) ;;
                *) exit 2 ;;
              esac
              git config --global --add safe.directory /work/source
              git config --global --add safe.directory /work/tools
              make -C dev cppgm++ -j16
              python3 -u ../tools/scripts/intel_library_benchmarks.py run \
                --suite "$SUITE" --source /work/source --jobs 16
            '
      - name: Report
        if: always()
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          report="source/obj/$SUITE/details.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Collect results and diagnostics
        if: always()
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          python3 tools/scripts/intel_library_benchmarks.py collect \
            "source/obj/$SUITE" evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: intel-${{ inputs.suite }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish Intel ${{ inputs.suite }}
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 5
    concurrency:
      group: benchmark-badge-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: benchmark-badges
          path: badge-branch
      - uses: actions/download-artifact@v7
        with:
          name: intel-${{ inputs.suite }}-${{ github.run_id }}
          path: artifact
      - name: Publish the dedicated Intel results
        env:
          SUITE: ${{ inputs.suite }}
          REVISION: ${{ needs.measure.outputs.revision }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scripts/intel_library_benchmarks.py publish \
            --suite "$SUITE" --artifact artifact --target badge-branch \
            --revision "$REVISION" --run-url "$RUN_URL"
          freshness_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          python3 tools/scripts/internal_cpp_benchmarks.py seed badge-branch
          python3 tools/scripts/benchmark_freshness.py badge-branch \
            --repo "$GITHUB_REPOSITORY" --revision "$freshness_revision"
          cd badge-branch
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish dedicated Intel $SUITE measurements of $REVISION"
          git push origin HEAD:benchmark-badges
