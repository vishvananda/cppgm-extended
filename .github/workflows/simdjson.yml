name: simdjson benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Benchmark host
        type: choice
        options: [github, intel]
        default: github
      revision:
        description: Intel run's trusted compiler commit or ref
        type: string
        default: ''
      runner_label:
        description: Intel runner label supplied by the temporary-runner helper
        type: string
        default: cppgm-intel

permissions:
  contents: read

jobs:
  benchmarks:
    if: inputs.platform != 'intel'
    name: simdjson correctness and performance
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CXX: g++
      CPPGM_HOST_CXX: g++
      CPPGM_STDLIB_FLAGS: ""
      CPPGM_WARNINGS_AS_ERRORS: "1"
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential binutils ca-certificates clang git python3 time
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build compiler
        run: make -C dev cppgm++ -j "$(nproc)"
      - name: Build, validate and measure scalar and SSE parsers
        run: python3 scripts/simdjson_ci.py run --output obj/simdjson
      - name: Report
        if: always()
        run: |
          if [ -f obj/simdjson/details.md ]; then
            cat obj/simdjson/details.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain results and raw observations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: simdjson-${{ github.sha }}-${{ github.run_id }}
          path: |
            obj/simdjson/*.json
            obj/simdjson/*.jsonl
            obj/simdjson/*.md
            obj/simdjson/*.stdout
            obj/simdjson/*.stderr
            obj/simdjson/*.time
            obj/simdjson/*.perf
            obj/simdjson/*probe
            obj/simdjson/*.log
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: publish simdjson results
    needs: benchmarks
    # PRs have no publication credentials. Only trusted main results publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: benchmark-badge-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: benchmark-badges
          path: badge-branch
      - uses: actions/download-artifact@v7
        with:
          name: simdjson-${{ github.sha }}-${{ github.run_id }}
          path: artifact
      - name: Publish comparison and retained history
        env:
          REVISION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scripts/simdjson_ci.py publish artifact badge-branch \
            --revision "$REVISION" --run-url "$RUN_URL"
          freshness_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          python3 tools/scripts/internal_cpp_benchmarks.py seed badge-branch
          python3 tools/scripts/benchmark_freshness.py badge-branch \
            --repo "$GITHUB_REPOSITORY" --revision "$freshness_revision"
          cd badge-branch
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish simdjson benchmarks of $REVISION"
          git push origin HEAD:benchmark-badges

  intel:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'intel' && github.actor == github.repository_owner
    permissions:
      contents: write
    uses: ./.github/workflows/intel-library-benchmarks.yml
    with:
      suite: simdjson
      revision: ${{ inputs.revision || github.sha }}
      runner_label: ${{ inputs.runner_label }}
