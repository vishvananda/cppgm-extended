name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-placement:
    name: test placement audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run PA feature placement audit
        run: |
          set +e
          report="$RUNNER_TEMP/pa-feature-placement-audit.md"
          python3 scripts/audit_pa_feature_placement.py \
            --fail-on-early \
            --markdown-out "$report"
          status=$?
          if [ "$status" -eq 0 ]; then
            {
              echo "### Test Placement Audit"
              echo
              echo "No tests use a detected feature before its owning PA/cluster."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  test:
    name: ${{ matrix.suite }} / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: test-report
            target: test-report
            name: gcc + libstdc++ (ubuntu 24.04)
            packages: build-essential
            cxx: g++
            host_cxx: g++
            stdlib_flags: ""
          - suite: test-strict
            target: test-strict
            name: gcc + libstdc++ (ubuntu 24.04)
            packages: build-essential
            cxx: g++
            host_cxx: g++
            stdlib_flags: ""
          - suite: test-report
            target: test-report
            name: clang + libc++ (ubuntu 24.04)
            packages: build-essential clang libc++-dev libc++abi-dev
            cxx: clang++
            host_cxx: clang++
            stdlib_flags: -stdlib=libc++
          - suite: test-strict
            target: test-strict
            name: clang + libc++ (ubuntu 24.04)
            packages: build-essential clang libc++-dev libc++abi-dev
            cxx: clang++
            host_cxx: clang++
            stdlib_flags: -stdlib=libc++

    env:
      CXX: ${{ matrix.cxx }}
      CPPGM_HOST_CXX: ${{ matrix.host_cxx }}
      CPPGM_STDLIB_FLAGS: ${{ matrix.stdlib_flags }}
      CPPGM_LOWIR_DIRECT_TEXT_COMPARE: "1"
      ORDERED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Show compiler configuration
        run: |
          "$CXX" --version
          printf 'CXX=%s\n' "$CXX"
          printf 'CPPGM_HOST_CXX=%s\n' "$CPPGM_HOST_CXX"
          printf 'CPPGM_STDLIB_FLAGS=%s\n' "$CPPGM_STDLIB_FLAGS"

      - name: Run ${{ matrix.suite }}
        run: make ${{ matrix.target }}

  test-ubuntu-26:
    name: ${{ matrix.suite }} / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: test-report
            target: test-report
            name: gcc + libstdc++ (ubuntu 26.04)
            packages: build-essential
            cxx: g++
            host_cxx: g++
            stdlib_flags: ""
          - suite: test-strict
            target: test-strict
            name: gcc + libstdc++ (ubuntu 26.04)
            packages: build-essential
            cxx: g++
            host_cxx: g++
            stdlib_flags: ""
          - suite: test-report
            target: test-report
            name: clang + libc++ (ubuntu 26.04)
            packages: build-essential clang libc++-dev libc++abi-dev
            cxx: clang++
            host_cxx: clang++
            stdlib_flags: -stdlib=libc++
          - suite: test-strict
            target: test-strict
            name: clang + libc++ (ubuntu 26.04)
            packages: build-essential clang libc++-dev libc++abi-dev
            cxx: clang++
            host_cxx: clang++
            stdlib_flags: -stdlib=libc++

    env:
      CXX: ${{ matrix.cxx }}
      CPPGM_HOST_CXX: ${{ matrix.host_cxx }}
      CPPGM_STDLIB_FLAGS: ${{ matrix.stdlib_flags }}
      CPPGM_LOWIR_DIRECT_TEXT_COMPARE: "1"
      ORDERED: "false"

    steps:
      - name: Install checkout and host compiler dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            git \
            perl \
            ${{ matrix.packages }}

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show compiler configuration
        run: |
          "$CXX" --version
          printf 'CXX=%s\n' "$CXX"
          printf 'CPPGM_HOST_CXX=%s\n' "$CPPGM_HOST_CXX"
          printf 'CPPGM_STDLIB_FLAGS=%s\n' "$CPPGM_STDLIB_FLAGS"
          cat /etc/os-release

      - name: Run ${{ matrix.suite }}
        run: make ${{ matrix.target }}
