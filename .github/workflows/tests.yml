name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-placement:
    name: test placement audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run PA feature placement audit
        run: |
          set +e
          report="$RUNNER_TEMP/pa-feature-placement-audit.md"
          python3 scripts/audit_pa_feature_placement.py \
            --fail-on-early \
            --markdown-out "$report"
          status=$?
          if [ "$status" -eq 0 ]; then
            {
              echo "### Test Placement Audit"
              echo
              echo "No tests use a detected feature before its owning PA/cluster."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  build:
    name: build / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-24.04-gcc
            name: gcc + libstdc++ (ubuntu 24.04)
            image: ubuntu:24.04
            packages: build-essential
            cxx: g++
            host_cxx: g++
            stdlib_flags: ""
          - id: ubuntu-24.04-clang-libcxx
            name: clang + libc++ (ubuntu 24.04)
            image: ubuntu:24.04
            packages: build-essential clang libc++-dev libc++abi-dev
            cxx: clang++
            host_cxx: clang++
            stdlib_flags: -stdlib=libc++
          - id: ubuntu-26.04-gcc
            name: gcc + libstdc++ (ubuntu 26.04)
            image: ubuntu:26.04
            packages: build-essential
            cxx: g++
            host_cxx: g++
            stdlib_flags: ""
          - id: ubuntu-26.04-clang-libcxx
            name: clang + libc++ (ubuntu 26.04)
            image: ubuntu:26.04
            packages: build-essential clang libc++-dev libc++abi-dev
            cxx: clang++
            host_cxx: clang++
            stdlib_flags: -stdlib=libc++

    env:
      CXX: ${{ matrix.cxx }}
      CPPGM_HOST_CXX: ${{ matrix.host_cxx }}
      CPPGM_STDLIB_FLAGS: ${{ matrix.stdlib_flags }}
      ORDERED: "false"

    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            git \
            perl \
            tar \
            ${{ matrix.packages }}

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show compiler configuration
        run: |
          "$CXX" --version
          printf 'CXX=%s\n' "$CXX"
          printf 'CPPGM_HOST_CXX=%s\n' "$CPPGM_HOST_CXX"
          printf 'CPPGM_STDLIB_FLAGS=%s\n' "$CPPGM_STDLIB_FLAGS"
          cat /etc/os-release

      - name: Build host compiler
        run: make

      - name: Upload host compiler build
        run: |
          set -euo pipefail
          upload="$RUNNER_TEMP/cppgm-build-upload"
          mkdir -p "$upload"
          {
            for exe in \
              abimangle \
              pptoken posttoken ctrlexpr macro preproc recog nsdecl nsinit cy86 \
              cppgm++ lowir2cy86 lowiropt lowir2native cpplink cppeh; do
              printf 'dev/%s\n' "$exe"
            done
            if [ -d obj/generated ]; then
              find obj/generated -type f -print
            fi
          } | sort > "$RUNNER_TEMP/cppgm-build-files.txt"
          tar -czf "$upload/cppgm-build.tar.gz" -T "$RUNNER_TEMP/cppgm-build-files.txt"
          {
            printf 'flavor=%s\n' "${{ matrix.id }}"
            printf 'cxx=%s\n' "$CXX"
            printf 'cppgm_host_cxx=%s\n' "$CPPGM_HOST_CXX"
            printf 'cppgm_stdlib_flags=%s\n' "$CPPGM_STDLIB_FLAGS"
          } > "$upload/metadata.env"

      - name: Store host compiler build
        uses: actions/upload-artifact@v6
        with:
          name: cppgm-build-${{ matrix.id }}
          path: ${{ runner.temp }}/cppgm-build-upload/
          if-no-files-found: error
          retention-days: 1

  test:
    name: ${{ matrix.suite.name }} / ${{ matrix.flavor.name }}
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.flavor.image }}
    timeout-minutes: ${{ matrix.suite.timeout }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        flavor:
          - id: ubuntu-24.04-gcc
            name: gcc + libstdc++ (ubuntu 24.04)
            image: ubuntu:24.04
            host_packages: build-essential
            strict_packages: make libstdc++6
            cxx: g++
            host_cxx: g++
            stdlib_flags: ""
            artifact_name: pa38-cppgm-self-ubuntu-24.04-gcc
          - id: ubuntu-24.04-clang-libcxx
            name: clang + libc++ (ubuntu 24.04)
            image: ubuntu:24.04
            host_packages: build-essential clang libc++-dev libc++abi-dev
            strict_packages: make libc++-dev libc++abi-dev
            cxx: clang++
            host_cxx: clang++
            stdlib_flags: -stdlib=libc++
            artifact_name: pa38-cppgm-self-ubuntu-24.04-clang-libcxx
          - id: ubuntu-26.04-gcc
            name: gcc + libstdc++ (ubuntu 26.04)
            image: ubuntu:26.04
            host_packages: build-essential
            strict_packages: make libstdc++6
            cxx: g++
            host_cxx: g++
            stdlib_flags: ""
            artifact_name: pa38-cppgm-self-ubuntu-26.04-gcc
          - id: ubuntu-26.04-clang-libcxx
            name: clang + libc++ (ubuntu 26.04)
            image: ubuntu:26.04
            host_packages: build-essential clang libc++-dev libc++abi-dev
            strict_packages: make libc++-dev libc++abi-dev
            cxx: clang++
            host_cxx: clang++
            stdlib_flags: -stdlib=libc++
            artifact_name: pa38-cppgm-self-ubuntu-26.04-clang-libcxx
        suite:
          - id: test-report
            name: test-report
            command: make test-report-nobuild
            timeout: 120
          - id: test-strict
            name: test-strict
            command: make test-strict-nobuild
            timeout: 120
          - id: selfhost-through-pa10
            name: test-through-pa10
            command: make -C pa39 test-through-pa10 CXX=../dev/cppgm++ CPPGM_HOST_CXX="$CPPGM_HOST_CXX" CPPGM_STDLIB_FLAGS="$CPPGM_STDLIB_FLAGS"
            timeout: 90

    env:
      CXX: ${{ matrix.flavor.cxx }}
      CPPGM_HOST_CXX: ${{ matrix.flavor.host_cxx }}
      CPPGM_STDLIB_FLAGS: ${{ matrix.flavor.stdlib_flags }}
      CPPGM_LOWIR_DIRECT_TEXT_COMPARE: "1"
      ORDERED: "false"
      SELFHOST_FLAVOR: ${{ matrix.flavor.id }}
      SELFHOST_RUNNER_IMAGE: ${{ matrix.flavor.image }}
      SELFHOST_ARTIFACT_NAME: ${{ matrix.flavor.artifact_name }}

    steps:
      - name: Install checkout and host compiler dependencies
        run: |
          packages="${{ matrix.flavor.host_packages }}"
          if [ "${{ matrix.suite.id }}" = "test-strict" ]; then
            packages="${{ matrix.flavor.strict_packages }}"
          fi
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            git \
            perl \
            tar \
            $packages

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download host compiler build
        uses: actions/download-artifact@v7
        with:
          name: cppgm-build-${{ matrix.flavor.id }}
          path: ${{ runner.temp }}/cppgm-build-artifact

      - name: Restore host compiler build
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/cppgm-build-artifact/cppgm-build.tar.gz"
          cat "$RUNNER_TEMP/cppgm-build-artifact/metadata.env"
          test -x dev/abimangle
          test -x dev/cppgm++

      - name: Show compiler configuration
        run: |
          if command -v "$CXX" >/dev/null 2>&1; then
            "$CXX" --version
          else
            printf '%s is not installed in this lightweight test job\n' "$CXX"
          fi
          printf 'CXX=%s\n' "$CXX"
          printf 'CPPGM_HOST_CXX=%s\n' "$CPPGM_HOST_CXX"
          printf 'CPPGM_STDLIB_FLAGS=%s\n' "$CPPGM_STDLIB_FLAGS"
          cat /etc/os-release

      - name: Run ${{ matrix.suite.name }}
        run: ${{ matrix.suite.command }}

      - name: Package cppgm++ self compiler
        if: matrix.suite.id == 'selfhost-through-pa10'
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          bundle="$RUNNER_TEMP/pa38-cppgm-self"
          upload="$RUNNER_TEMP/pa38-cppgm-self-upload"
          mkdir -p "$bundle/bin" "$upload"
          cp obj/pa39/bin/selfhost/cppgm++-self "$bundle/bin/cppgm++-self"
          chmod 755 "$bundle/bin/cppgm++-self"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_ref=%s\n' "$GITHUB_REF"
            printf 'source_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'selfhost_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'selfhost_flavor=%s\n' "$SELFHOST_FLAVOR"
            printf 'runner_image=%s\n' "$SELFHOST_RUNNER_IMAGE"
            printf 'cxx=%s\n' "$CXX"
            printf 'cppgm_host_cxx=%s\n' "$CPPGM_HOST_CXX"
            printf 'cppgm_stdlib_flags=%s\n' "$CPPGM_STDLIB_FLAGS"
          } > "$bundle/metadata.env"
          (cd "$bundle" && sha256sum bin/cppgm++-self > SHA256SUMS)
          tar -C "$bundle" -czf "$upload/pa38-cppgm-self.tar.gz" .
          cp "$bundle/metadata.env" "$upload/metadata.env"
          cp "$bundle/SHA256SUMS" "$upload/SHA256SUMS"
          {
            echo "### Self compiler artifact"
            echo
            echo "- Flavor: \`$SELFHOST_FLAVOR\`"
            echo "- Artifact: \`$SELFHOST_ARTIFACT_NAME\`"
            echo "- Workflow run id: \`$GITHUB_RUN_ID\`"
            echo "- Source SHA: \`$source_sha\`"
            echo
            echo "Manual inception run:"
            echo
            echo "[Open Inception workflow](https://github.com/$GITHUB_REPOSITORY/actions/workflows/inception.yml)"
            echo
            echo "\`\`\`sh"
            echo "gh workflow run inception.yml -f selfhost_run_id=$GITHUB_RUN_ID -f flavor=$SELFHOST_FLAVOR"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cppgm++ self compiler
        if: matrix.suite.id == 'selfhost-through-pa10'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.SELFHOST_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/pa38-cppgm-self-upload/
          if-no-files-found: error
          retention-days: 14
