name: Public benchmarks

on:
  push:
  workflow_dispatch:
    inputs:
      platform:
        description: Benchmark host
        type: choice
        options: [github, intel]
        default: github
      revision:
        description: Intel run's trusted commit or ref (empty means this workflow's revision)
        type: string
        default: ''
      runner_label:
        description: Intel runner label (the temporary-runner helper supplies a unique label)
        type: string
        default: cppgm-intel
      course_quality:
        description: Also measure the optional course optimization exercises
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-benchmarks-${{ github.ref }}-${{ inputs.platform || 'github' }}
  cancel-in-progress: true

env:
  CPPGM_WARNINGS_AS_ERRORS: "1"

jobs:
  benchmarks:
    name: public benchmarks
    if: inputs.platform != 'intel'
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    # A wrong output or a build failure fails this job. A changed count warns.
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      CXX: g++
      CPPGM_HOST_CXX: g++
      CPPGM_STDLIB_FLAGS: ""

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang git libgmp-dev patch python3 time valgrind

      - uses: actions/checkout@v6

      - name: Build compiler
        run: make -C dev cppgm++

      - name: Cache pinned sources
        uses: actions/cache@v4
        with:
          path: obj/public-benchmarks/src
          key: public-benchmarks-${{ hashFiles('benchmarks/public/manifest.json', 'benchmarks/public/patches/**') }}

      - name: Fetch pinned sources
        run: python3 scripts/public_benchmarks.py fetch --cache obj/public-benchmarks/src

      - name: Build, run and compare
        run: |
          python3 scripts/public_benchmarks.py run \
            --cache obj/public-benchmarks/src \
            --work obj/public-benchmarks/work \
            --output obj/public-benchmarks/results.json \
            --jobs "$(nproc)"

      - name: Report
        run: |
          python3 scripts/public_benchmarks.py report obj/public-benchmarks/results.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --details obj/public-benchmarks/details.md \
            --badges obj/public-benchmarks/badges

      - name: Measure optional course exercises
        if: github.event_name == 'workflow_dispatch' && inputs.course_quality
        run: |
          python3 scripts/check_optimization_quality.py pa32/tests/improvements \
            --mode native --compiler dev/cppgm++ --report-only \
            --iterations 1000000 --timing-rounds 6 \
            --out obj/public-benchmarks/course-quality

      - name: Retain results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-benchmarks-${{ github.sha }}
          path: |
            obj/public-benchmarks/results.json
            obj/public-benchmarks/details.md
            obj/public-benchmarks/work/timing/
            obj/public-benchmarks/badges/
            obj/public-benchmarks/course-quality/
          if-no-files-found: warn
          retention-days: 14

  badges:
    name: publish README badges
    needs: benchmarks
    # Only this job has the write token. Do not run third-party code here.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: benchmark-badge-publication
      queue: max
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: benchmark-badges
          path: badge-branch
      - uses: actions/download-artifact@v7
        with:
          name: public-benchmarks-${{ github.sha }}
          path: artifact

      - name: Publish to the badge branch
        env:
          REVISION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scripts/publish_benchmark_badges.py artifact badge-branch \
            --component public --platform github --revision "$REVISION" --run-url "$RUN_URL" --legacy-epyc
          freshness_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          python3 tools/scripts/internal_cpp_benchmarks.py seed badge-branch
          python3 tools/scripts/benchmark_freshness.py badge-branch \
            --repo "$GITHUB_REPOSITORY" --revision "$freshness_revision"
          cd badge-branch
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish hosted benchmark badges of $REVISION"
          git push origin HEAD:benchmark-badges

  intel:
    name: Intel public benchmarks (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'intel' && github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, '${{ inputs.runner_label }}']
    timeout-minutes: 90
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Record the measured revision and check Intel hardware
        id: revision
        run: |
          python3 -c 'import pathlib; assert "GenuineIntel" in pathlib.Path("/proc/cpuinfo").read_text(), "Intel CPU required"'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run the benchmark suite in Ubuntu 26.04
        env:
          COURSE_QUALITY: ${{ inputs.course_quality }}
        run: |
          engine=$(command -v podman || command -v docker)
          "$engine" run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e CXX=g++ -e CPPGM_HOST_CXX=g++ -e CPPGM_STDLIB_FLAGS= \
            -e CPPGM_WARNINGS_AS_ERRORS=1 \
            -e COURSE_QUALITY \
            ubuntu:26.04 bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates clang git libgmp-dev patch python3 time valgrind
              git config --global --add safe.directory /work
              jobs=16
              make -C dev cppgm++ -j "$jobs"
              python3 scripts/public_benchmarks.py fetch --cache obj/public-benchmarks/src
              python3 scripts/public_benchmarks.py run \
                --cache obj/public-benchmarks/src --work obj/public-benchmarks/work \
                --output obj/public-benchmarks/results.json --jobs "$jobs"
              python3 scripts/public_benchmarks.py report obj/public-benchmarks/results.json \
                --summary obj/public-benchmarks/summary.md \
                --details obj/public-benchmarks/details.md \
                --badges obj/public-benchmarks/badges
              if [ "$COURSE_QUALITY" = true ]; then
                python3 scripts/check_optimization_quality.py pa32/tests/improvements \
                  --mode native --compiler dev/cppgm++ --report-only \
                  --iterations 1000000 --timing-rounds 6 \
                  --out obj/public-benchmarks/course-quality
              fi
            '
          cat obj/public-benchmarks/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain Intel results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-benchmarks-intel-${{ steps.revision.outputs.sha }}
          path: |
            obj/public-benchmarks/results.json
            obj/public-benchmarks/details.md
            obj/public-benchmarks/work/timing/
            obj/public-benchmarks/badges/
            obj/public-benchmarks/course-quality/
          if-no-files-found: warn
          retention-days: 14

  intel-badges:
    name: publish Intel README badges
    needs: intel
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'intel' && needs.intel.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: benchmark-badge-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: benchmark-badges
          path: badge-branch
      - uses: actions/download-artifact@v7
        with:
          name: public-benchmarks-intel-${{ needs.intel.outputs.revision }}
          path: artifact
      - name: Publish Intel measurements without changing EPYC badges
        env:
          REVISION: ${{ needs.intel.outputs.revision }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scripts/publish_benchmark_badges.py artifact badge-branch \
            --component public --platform intel --revision "$REVISION" --run-url "$RUN_URL"
          freshness_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          python3 tools/scripts/internal_cpp_benchmarks.py seed badge-branch
          python3 tools/scripts/benchmark_freshness.py badge-branch \
            --repo "$GITHUB_REPOSITORY" --revision "$freshness_revision"
          cd badge-branch
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish Intel benchmark badges of $REVISION"
          git push origin HEAD:benchmark-badges
