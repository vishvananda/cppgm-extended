name: Wasm32 benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Benchmark host
        type: choice
        options: [github, intel]
        default: github
      revision:
        description: Intel run's trusted compiler commit or ref
        type: string
        default: ''
      runner_label:
        description: Intel runner label supplied by the temporary-runner helper
        type: string
        default: cppgm-intel

permissions:
  contents: read

concurrency:
  group: wasm-benchmarks-${{ github.ref }}-${{ inputs.platform || 'github' }}
  cancel-in-progress: true

jobs:
  benchmarks:
    if: inputs.platform != 'intel'
    name: Wasm compile, size, startup and steady execution
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CXX: g++
      CPPGM_HOST_CXX: g++
      CPPGM_STDLIB_FLAGS: ''
      CPPGM_WARNINGS_AS_ERRORS: '1'
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git perl python3 util-linux xz-utils
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build compiler
        run: make -C dev cppgm++ -j "$(nproc)"
      - name: Install pinned engine and reference tools
        run: perl scripts/install_wasm_tools.pl --prefix obj/wasm-tools --benchmark-engine
      - name: Measure both optimization levels
        run: |
          for level in 0 3; do
            perl scripts/wasm_benchmarks.pl --tools obj/wasm-tools \
              --level "$level" --output "obj/wasm/O$level"
          done
      - name: Generate standard records and tables
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/wasm_benchmark_results.py report obj/wasm/O0 obj/wasm/O3 \
            --output obj/wasm/standard --environment 'GitHub hosted; Ubuntu 26.04 container' --run-url "$RUN_URL"
      - name: Report available results
        if: always()
        run: |
          if [ -f obj/wasm/standard/summary.md ]; then
            cat obj/wasm/standard/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            for level in 0 3; do
              if [ -f "obj/wasm/O$level/details.md" ]; then
                cat "obj/wasm/O$level/details.md" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
      - name: Retain measurements and raw observations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wasm-${{ github.sha }}-${{ github.run_id }}
          path: |
            obj/wasm/
            !obj/wasm/**/runner
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish Wasm results
    needs: benchmarks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: benchmark-badge-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: benchmark-badges
          path: badge-branch
      - uses: actions/download-artifact@v7
        with:
          name: wasm-${{ github.sha }}-${{ github.run_id }}
          path: artifact
      - name: Publish compact reports and refresh badges
        env:
          REVISION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scripts/wasm_benchmark_results.py publish artifact/O0 artifact/O3 \
            --target badge-branch --revision "$REVISION" --run-url "$RUN_URL"
          freshness_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          python3 tools/scripts/internal_cpp_benchmarks.py seed badge-branch
          python3 tools/scripts/benchmark_freshness.py badge-branch \
            --repo "$GITHUB_REPOSITORY" --revision "$freshness_revision"
          python3 tools/scripts/benchmark_publication.py prepare badge-branch
          cd badge-branch
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish Wasm benchmarks of $REVISION"
          git push origin HEAD:benchmark-badges

  intel:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'intel' && github.actor == github.repository_owner
    permissions:
      contents: write
    uses: ./.github/workflows/intel-library-benchmarks.yml
    with:
      suite: wasm
      revision: ${{ inputs.revision || github.sha }}
      runner_label: ${{ inputs.runner_label }}
