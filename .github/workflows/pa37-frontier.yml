name: PA37 Frontier

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Compiler and standard-library flavor
        required: true
        default: ubuntu-24.04-gcc
        type: choice
        options:
          - ubuntu-24.04-gcc
          - ubuntu-24.04-clang-libcxx
          - ubuntu-26.04-gcc
          - ubuntu-26.04-clang-libcxx

permissions:
  contents: read

jobs:
  test-through-pa10:
    name: pa37 test-through-pa10 (gcc + libstdc++, ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.flavor == 'ubuntu-24.04-gcc'

    env:
      CXX: g++
      CPPGM_HOST_CXX: g++
      CPPGM_STDLIB_FLAGS: ""
      ORDERED: "false"
      FRONTIER_FLAVOR: ubuntu-24.04-gcc
      FRONTIER_RUNNER_IMAGE: ubuntu-24.04
      FRONTIER_ARTIFACT_NAME: pa37-cppgm-self-ubuntu-24.04-gcc

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Show compiler configuration
        run: |
          "$CXX" --version
          printf 'CXX=%s\n' "$CXX"
          printf 'CPPGM_HOST_CXX=%s\n' "$CPPGM_HOST_CXX"
          printf 'CPPGM_STDLIB_FLAGS=%s\n' "$CPPGM_STDLIB_FLAGS"

      - name: Build host compiler
        run: make -C dev cppgm++

      - name: Run PA37 through PA10
        run: |
          make -C pa37 test-through-pa10 \
            CXX=../dev/cppgm++ \
            CPPGM_HOST_CXX="$CPPGM_HOST_CXX" \
            CPPGM_STDLIB_FLAGS="$CPPGM_STDLIB_FLAGS"

      - name: Package cppgm++ self compiler
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          bundle="$RUNNER_TEMP/pa37-cppgm-self"
          upload="$RUNNER_TEMP/pa37-cppgm-self-upload"
          mkdir -p "$bundle/bin" "$upload"
          cp obj/pa37/bin/selfhost/cppgm++-self "$bundle/bin/cppgm++-self"
          chmod 755 "$bundle/bin/cppgm++-self"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_ref=%s\n' "$GITHUB_REF"
            printf 'source_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'frontier_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'frontier_flavor=%s\n' "$FRONTIER_FLAVOR"
            printf 'runner_image=%s\n' "$FRONTIER_RUNNER_IMAGE"
            printf 'cxx=%s\n' "$CXX"
            printf 'cppgm_host_cxx=%s\n' "$CPPGM_HOST_CXX"
            printf 'cppgm_stdlib_flags=%s\n' "$CPPGM_STDLIB_FLAGS"
          } > "$bundle/metadata.env"
          (cd "$bundle" && sha256sum bin/cppgm++-self > SHA256SUMS)
          tar -C "$bundle" -czf "$upload/pa37-cppgm-self.tar.gz" .
          cp "$bundle/metadata.env" "$upload/metadata.env"
          cp "$bundle/SHA256SUMS" "$upload/SHA256SUMS"
          {
            echo "### PA37 self compiler artifact"
            echo
            echo "- Flavor: \`$FRONTIER_FLAVOR\`"
            echo "- Artifact: \`$FRONTIER_ARTIFACT_NAME\`"
            echo "- Frontier run id: \`$GITHUB_RUN_ID\`"
            echo "- Source SHA: \`$source_sha\`"
            echo
            echo "Push and PR frontier runs trigger inception automatically."
            echo "Manual inception run:"
            echo
            echo "\`\`\`sh"
            echo "gh workflow run pa37-inception.yml -f frontier_run_id=$GITHUB_RUN_ID -f artifact_name=$FRONTIER_ARTIFACT_NAME"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cppgm++ self compiler
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.FRONTIER_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/pa37-cppgm-self-upload/
          if-no-files-found: error
          retention-days: 14

  test-through-pa10-ubuntu-24-clang:
    name: pa37 test-through-pa10 (clang + libc++, ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
