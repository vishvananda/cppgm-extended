name: Upstream C++11 correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-cxx11:
    # These are two independently reported jobs; a failure cannot cancel its peer.
    name: ${{ matrix.suite }} C++11 correctness and suite timing
    runs-on: ubuntu-24.04
    container: ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c # 26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: gcc
            repository: gcc-mirror/gcc
            revision: 5115c7e447fc07457443df874bf57840e8316d5f
            sparse: gcc/testsuite/g++.dg/cpp0x
            upstream: g++-15
            version: 15.2.0
          - suite: clang
            repository: llvm/llvm-project
            revision: 2078da43e25a4623cab2d0d60decddf709aaea28
            sparse: |
              clang/test
              llvm/utils/lit
            upstream: clang++-21
            version: 21.1.8
    defaults:
      run:
        shell: bash
    env:
      CXX: g++-15
      CPPGM_HOST_CXX: g++-15
      CPPGM_WARNINGS_AS_ERRORS: "1"

    steps:
      - name: Initialize retained setup evidence
        run: |
          mkdir -p "$RUNNER_TEMP/cxx11/environment"
          uname -a > "$RUNNER_TEMP/cxx11/environment/platform.txt"
          cat /etc/os-release > "$RUNNER_TEMP/cxx11/environment/os-release.txt"
          printf '%s\n' 'ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c' \
            > "$RUNNER_TEMP/cxx11/environment/container.txt"

      - name: Install snapshot-pinned compiler and metadata tools
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/cxx11/environment/setup.log") 2>&1
          # The signed snapshot fixes the complete dependency universe, not just
          # the named compiler packages. Release expiry is irrelevant to a fixed snapshot.
          cat > "$RUNNER_TEMP/cxx11/environment/ubuntu.sources" <<'SOURCES'
          Types: deb
          URIs: http://snapshot.ubuntu.com/ubuntu/20261107T000000Z/
          Suites: resolute resolute-updates resolute-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Check-Valid-Until: no
          SOURCES
          apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/cxx11/environment/ubuntu.sources"
                       -o Dir::Etc::sourceparts=-)
          apt-get "${apt_options[@]}" update
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            ca-certificates git make python3 \
            g++-15=15.2.0-16ubuntu1 \
            tcl=8.6.16build1 dejagnu=1.6.3-2
          if [ '${{ matrix.suite }}' = clang ]; then
            apt-get "${apt_options[@]}" install -y --no-install-recommends clang-21=1:21.1.8-6ubuntu1
          fi
          dpkg-query -W > "$RUNNER_TEMP/cxx11/environment/packages.txt"
          env | sort | sed -n '/^CPPGM_/p; /^CXX=/p' > "$RUNNER_TEMP/cxx11/environment/build.txt"

      - name: Check out compiler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out pinned upstream tests and native metadata parser
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: upstream-sources
          sparse-checkout: ${{ matrix.sparse }}
          persist-credentials: false

      - name: Retain source license notices
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP'])/'cxx11/licenses'
          output.mkdir()
          records = []
          for root, names in [(Path('.'), ['NOTICE', 'LICENSE', 'LICENSE.txt', 'COPYING']),
                              (Path('upstream-sources'), ['COPYING', 'COPYING3', 'COPYING.RUNTIME',
                                                        'LICENSE.TXT', 'clang/LICENSE.TXT', 'llvm/LICENSE.TXT'])]:
              found = 0
              for name in names:
                  source = root/name
                  if source.is_file():
                      target = output/root.name/name if root.name else output/'compiler'/name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
                      records.append(dict(source=str(source), artifact=str(target.relative_to(output)),
                                          sha256=hashlib.sha256(target.read_bytes()).hexdigest()))
                      found += 1
              if not found:
                  raise RuntimeError('No source license notice found in '+str(root))
          (output/'manifest.json').write_text(json.dumps(records, indent=2)+'\n')
          PYCODE

      - name: Build cppgm
        run: |
          ulimit -c 0
          make -C dev -j2 cppgm++ CXX="$CXX" CPPGM_HOST_CXX="$CPPGM_HOST_CXX"

      - name: Freeze language test manifest
        run: |
          set -euo pipefail
          if [ '${{ matrix.suite }}' = gcc ]; then
            python3 scripts/build_gcc_cxx11_ci_manifest.py \
              --gcc-root upstream-sources --dejagnu-library /usr/share/dejagnu \
              --output "$RUNNER_TEMP/cxx11/manifest.json"
          else
            python3 scripts/build_clang_cxx11_ci_manifest.py \
              --llvm-root upstream-sources --verify-negatives --implicit-cxx11 --llvm-object-projections --local-inputs \
              --standalone-llvm-only-projections \
              --output "$RUNNER_TEMP/cxx11/manifest.json"
          fi

      - name: Qualify implicit-mode sources with strict native C++11
        if: matrix.suite == 'clang'
        id: qualification
        # Retain applicability failures and still run both normal compilers.
        continue-on-error: true
        run: |
          python3 scripts/qualify_clang_cxx11_ci_manifest.py \
            --manifest "$RUNNER_TEMP/cxx11/manifest.json" \
            --source-root upstream-sources --upstream '${{ matrix.upstream }}' \
            --upstream-version '${{ matrix.version }}' --workers 2 \
            --output "$RUNNER_TEMP/cxx11/qualification"

      - name: Run identical suite with cppgm and upstream compiler
        run: |
          ulimit -c 0
          python3 scripts/run_cxx11_ci_suite.py \
            --manifest "$RUNNER_TEMP/cxx11/manifest.json" \
            --source-root upstream-sources --candidate dev/cppgm++ \
            --upstream '${{ matrix.upstream }}' --upstream-version '${{ matrix.version }}' \
            --workers 2 --output "$RUNNER_TEMP/cxx11/run"

      - name: Require successful native C++11 qualification
        if: always() && matrix.suite == 'clang'
        run: test '${{ steps.qualification.outcome }}' = success

      - name: Publish counts and elapsed-time ratio
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/cxx11/environment"
          if [ -f "$RUNNER_TEMP/cxx11/qualification/summary.md" ]; then
            cat "$RUNNER_TEMP/cxx11/qualification/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/cxx11/run/summary.md" ]; then
            cat "$RUNNER_TEMP/cxx11/run/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The suite did not produce a complete timing report; see the failed setup/run step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/cxx11-${{ matrix.suite }}.tar.gz" cxx11

      - name: Retain manifest, commands, raw output and results for both compilers
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cxx11-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/cxx11-${{ matrix.suite }}.tar.gz
          if-no-files-found: error
          retention-days: 14
