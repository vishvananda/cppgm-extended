name: PA37 Inception

on:
  workflow_dispatch:
    inputs:
      frontier_run_id:
        description: GitHub Actions run id from a successful PA37 Frontier run
        required: true
      artifact_name:
        description: Name of the cppgm++ self compiler artifact
        required: true
        default: pa37-cppgm-self-ubuntu-24.04-gcc

permissions:
  actions: read
  contents: read

jobs:
  compare-cppgm-inception:
    name: compare cppgm++ inception from stored self compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      CXX: g++
      CPPGM_HOST_CXX: g++
      CPPGM_STDLIB_FLAGS: ""

    steps:
      - name: Download cppgm++ self compiler artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.frontier_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pa37-self-artifact

      - name: Read artifact metadata
        id: metadata
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/pa37-self-artifact/metadata.env"
          if [ ! -f "$metadata" ]; then
            echo "missing metadata.env in artifact" >&2
            exit 2
          fi
          source_sha=$(sed -n 's/^source_sha=//p' "$metadata" | head -n 1)
          source_repository=$(sed -n 's/^source_repository=//p' "$metadata" | head -n 1)
          if [ -z "$source_sha" ]; then
            echo "artifact metadata did not contain source_sha" >&2
            exit 2
          fi
          if [ -n "$source_repository" ] && [ "$source_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "artifact came from $source_repository, expected $GITHUB_REPOSITORY" >&2
            exit 2
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          cat "$metadata"

      - name: Check out matching source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.metadata.outputs.source_sha }}

      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Restore cppgm++ self compiler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pa37-restored-self"
          tar -C "$RUNNER_TEMP/pa37-restored-self" -xzf \
            "$RUNNER_TEMP/pa37-self-artifact/pa37-cppgm-self.tar.gz"
          (cd "$RUNNER_TEMP/pa37-restored-self" && sha256sum -c SHA256SUMS)
          test -x "$RUNNER_TEMP/pa37-restored-self/bin/cppgm++-self"
          "$RUNNER_TEMP/pa37-restored-self/bin/cppgm++-self" --version || true

      - name: Show compiler configuration
        run: |
          "$CXX" --version
          printf 'CXX=%s\n' "$CXX"
          printf 'CPPGM_HOST_CXX=%s\n' "$CPPGM_HOST_CXX"
          printf 'CPPGM_STDLIB_FLAGS=%s\n' "$CPPGM_STDLIB_FLAGS"
          printf 'PA37_RESTORED_CPPGM_SELF=%s\n' "$RUNNER_TEMP/pa37-restored-self/bin/cppgm++-self"

      - name: Compare cppgm++ inception
        run: |
          CPPGM_OBJECT_ROOT="$GITHUB_WORKSPACE/obj/pa37/restored-self-driver" \
            make -C pa37 compare-cppgm++-inception-from-restored-self \
            PA37_RESTORED_CPPGM_SELF="$RUNNER_TEMP/pa37-restored-self/bin/cppgm++-self" \
            CPPGM_HOST_CXX="$CPPGM_HOST_CXX"

      - name: Summarize result
        if: always()
        run: |
          {
            echo "### PA37 cppgm++ inception"
            echo
            echo "- Frontier run id: \`${{ inputs.frontier_run_id }}\`"
            echo "- Artifact: \`${{ inputs.artifact_name }}\`"
            echo "- Source SHA: \`${{ steps.metadata.outputs.source_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
